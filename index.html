<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GS1-128 Label Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.1/dist/bwip-js-min.js"></script>
  <style>
    :root {
      --bg: #f5faf6;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #15803d;
      --accent-2: #22c55e;
      --accent-dark: #166534;
      --accent-soft: #f0fdf4;
      --ok: #059669;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #dcfce7 0%, transparent 60%),
        radial-gradient(900px 400px at 110% 0%, #d1fae5 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: linear-gradient(120deg, #052e16 0%, #14532d 55%, #15803d 100%);
      color: #fff;
      padding: 1.75rem 1rem 4rem;
      position: relative;
      overflow: hidden;
    }
    header::after {
      content: ""; position: absolute; right: -80px; top: -80px; width: 280px; height: 280px;
      border-radius: 50%; background: radial-gradient(circle, rgba(74,222,128,.40), transparent 70%);
      pointer-events: none;
    }
    .header-top {
      max-width: 920px; margin: 0 auto; position: relative; z-index: 1;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 1.1rem; }
    .logo { height: 60px; width: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
    header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
    header p { margin: .2rem 0 0; color: #bbf7d0; font-size: .92rem; }
    .lang {
      display: flex; align-items: center; gap: .5rem; flex-shrink: 0;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px; padding: .3rem .4rem .3rem .75rem; backdrop-filter: blur(6px);
    }
    .lang span { font-size: .8rem; color: #bbf7d0; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .lang select {
      font-size: .92rem; padding: .4rem .6rem; border-radius: 8px; border: 0;
      background: #fff; color: var(--text); cursor: pointer; outline: none;
    }

    /* Layout */
    .wrap { max-width: 920px; margin: 0 auto; padding: 0 1rem; }
    main.wrap { margin-top: -2.75rem; margin-bottom: 3rem; position: relative; z-index: 2; }
    .card {
      background: var(--card); border: 1px solid rgba(226,232,240,.8);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 1.6rem; margin-bottom: 1.25rem;
      animation: rise .35s ease both;
    }
    .card:nth-of-type(2) { animation-delay: .05s; }
    .card:nth-of-type(3) { animation-delay: .1s; }
    .card:nth-of-type(4) { animation-delay: .15s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .step {
      display: flex; align-items: center; gap: .7rem;
      font-weight: 650; font-size: 1.05rem; margin: 0 0 1rem; letter-spacing: -.01em;
    }
    .step .num {
      width: 30px; height: 30px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 700; box-shadow: 0 4px 12px rgba(22,163,74,.35);
    }
    .hint { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
    code {
      background: var(--accent-soft); color: var(--accent-dark);
      padding: .1rem .4rem; border-radius: 6px; font-size: .84rem;
      font-family: ui-monospace, Consolas, monospace;
    }

    /* Upload */
    .upload {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      border: 1.5px dashed #bbf7d0; border-radius: 14px; padding: 1.1rem 1.25rem;
      background: #f7fef9; transition: border-color .2s, background .2s;
    }
    .upload:hover { border-color: var(--accent); background: var(--accent-soft); }
    .upload input[type=file] { font-size: .92rem; color: var(--muted); }
    .upload input[type=file]::file-selector-button {
      margin-right: .85rem; padding: .55rem 1.1rem; border: 0; border-radius: 10px;
      background: #14532d; color: #fff; font-weight: 600; cursor: pointer;
      transition: background .2s;
    }
    .upload input[type=file]::file-selector-button:hover { background: var(--accent); }

    .status { margin-top: .9rem; font-size: .92rem; }
    .status.ok { color: var(--ok); font-weight: 500; }
    .status.err {
      color: var(--danger); background: var(--danger-soft);
      border-radius: 12px; padding: .8rem 1rem; white-space: pre-wrap;
    }

    /* Search */
    .search { position: relative; }
    .search input {
      width: 100%; font-size: 1rem; padding: .8rem 1rem .8rem 2.75rem;
      border: 1px solid var(--line); border-radius: 12px; outline: none;
      background: #fff; transition: border-color .15s, box-shadow .15s;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(22,163,74,.14); }
    .search input:disabled { background: #f8fafc; color: var(--muted); }
    .search::before {
      content: ""; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      width: 14px; height: 14px; border: 2px solid var(--muted); border-radius: 50%;
    }
    .search::after {
      content: ""; position: absolute; left: calc(1rem + 11px); top: calc(50% + 6px);
      width: 6px; height: 2px; background: var(--muted); transform: rotate(45deg);
    }
    .list {
      margin-top: .7rem; border: 1px solid var(--line); border-radius: 12px;
      max-height: 330px; overflow-y: auto; background: #fff;
    }
    .list:empty { display: none; }
    .list .row {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: .75rem 1rem; cursor: pointer; border-bottom: 1px solid #f1f5f9;
      transition: background .12s;
    }
    .list .row:last-child { border-bottom: 0; }
    .list .row:hover { background: var(--accent-soft); }
    .list .code { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text); }
    .list .desc { color: var(--muted); font-size: .9rem; flex: 1; text-align: left; }

    .badge {
      font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      padding: .25rem .6rem; border-radius: 999px; white-space: nowrap;
    }
    .badge.box { background: #fef3c7; color: #92400e; }
    .badge.piece { background: #d1fae5; color: #065f46; }
    .badge.kg { background: #ccfbf1; color: #115e59; }

    /* Selected article */
    #sel { display: none; }
    #sel.show { display: block; }
    .article {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap;
      background: linear-gradient(135deg, #f0fdf4, #ecfdf5); border: 1px solid #bbf7d0;
      border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: 1.25rem;
    }
    .article .title { font-weight: 700; font-size: 1.08rem; letter-spacing: -.01em; }
    .article .meta { color: var(--muted); font-size: .88rem; margin-top: .25rem; }
    .article .gtin { font-family: ui-monospace, Consolas, monospace; color: var(--text); }

    /* Fields & buttons */
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .opt-grid .field input { width: 100%; }
    .opt-grid .field input[type=date] { font-family: inherit; }
    .optional-tag {
      font-size: .7rem; font-weight: 600; color: var(--muted); background: #f1f5f9;
      border-radius: 999px; padding: .12rem .55rem; margin-left: .5rem; text-transform: lowercase;
    }
    .gen-row { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
    .field label {
      display: block; font-size: .8rem; color: var(--muted); margin-bottom: .4rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    }
    .field input {
      width: 170px; font-size: 1.1rem; padding: .7rem .9rem; border: 1px solid var(--line);
      border-radius: 12px; outline: none; font-variant-numeric: tabular-nums; background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(22,163,74,.14); }

    .btn {
      font-size: .98rem; font-weight: 600; padding: .75rem 1.5rem; border: 0; border-radius: 12px;
      cursor: pointer; transition: background .15s, transform .06s, box-shadow .15s;
      letter-spacing: -.005em;
    }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
      box-shadow: 0 6px 16px rgba(22,163,74,.3);
    }
    .btn-primary:hover { box-shadow: 0 8px 22px rgba(22,163,74,.4); filter: brightness(1.05); }
    .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .btn-ghost:hover { background: #f8fafc; border-color: #cbd5e1; }
    #print[hidden], #ssccPrint[hidden] { display: none; }

    /* Output */
    #result:empty, #ssccResult:empty { display: none; }
    .label-preview {
      margin-top: 1.4rem; border: 1px solid var(--line); border-radius: 16px;
      padding: 1.4rem; text-align: center; background: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6);
    }
    .label-preview .enc {
      font-family: ui-monospace, Consolas, monospace; font-size: .92rem; color: var(--muted);
      margin-bottom: 1rem; word-break: break-all;
      background: #f8fafc; border-radius: 8px; padding: .4rem .6rem; display: inline-block;
    }
    .label-preview canvas { max-width: 100%; height: auto; }
    .err-box {
      background: var(--danger-soft); color: var(--danger); font-weight: 500;
      border-radius: 12px; padding: .8rem 1rem; border: 1px solid #fecaca;
    }
    .actions { margin-top: 1rem; display: flex; justify-content: flex-end; }
    .sscc-out { margin-top: 1rem; }

    .empty { text-align: center; color: var(--muted); padding: 1.75rem 0 .5rem; font-size: .95rem; }
    footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 0 2rem; }

    @media print {
      body { background: #fff; }
      body * { visibility: hidden; }
      .printable, .printable * { visibility: visible; }
      .printable { position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
      .label-preview { border: 0; padding: 0; box-shadow: none; }
    }
    @media (max-width: 640px) {
      header h1 { font-size: 1.25rem; }
      .logo { height: 46px; }
      .header-top { flex-direction: column; align-items: flex-start; }
      .field input { width: 100%; }
      .opt-grid { grid-template-columns: 1fr; }
      .gen-row .btn { width: 100%; }
      .list .desc { display: none; }
      .card { padding: 1.2rem; }
    }
  </style>
</head>

        <div class="field">
          <label for="bbd"><span data-i18n="bbd"></span><span class="optional-tag" data-i18n="optional"></span></label>

      <div class="gen-row">
        <div class="field">
          <label for="qty" id="qtyLabel" data-i18n="qty"></label>
          <input id="qty" type="number" min="1" max="99999999" value="1">
        </div>
        <button id="gen" class="btn btn-primary" data-i18n="generate"></button>
      </div>

      <div id="result"></div>
      <div class="actions">
        <button id="print" class="btn btn-ghost" hidden onclick="window.print()" data-i18n="print"></button>
      </div>
    </section>

  let items = [];
  let current = null;
  const $ = (id) => document.getElementById(id);

  // ---------- Validare GTIN ----------
  function gtinCheckDigit(body13) {
    let sum = 0;
    for (let i = 0; i < body13.length; i++) {
      const digit = Number(body13[body13.length - 1 - i]);
      sum += digit * (i % 2 === 0 ? 3 : 1);
    }
    return (10 - (sum % 10)) % 10;
  }

  function normalizeGtin(raw) {
    const s = String(raw).trim();
    if (!/^\d+$/.test(s) || ![8, 12, 13, 14].includes(s.length)) {
      throw new Error(t('errGtinFormat', s));
    }
    const gtin14 = s.padStart(14, '0');
    if (gtinCheckDigit(gtin14.slice(0, 13)) !== Number(gtin14[13])) {
      throw new Error(t('errCheck', s));
    }
    return gtin14;
  }

  // ---------- Parsare CSV ----------
  function parseCsv(text) {
    text = text.replace(/^\uFEFF/, '');
    const lines = text.split(/\r?\n/).filter((l) => l.trim() !== '');
    if (lines.length < 2) throw new Error(t('errNoHeader'));
    const delim = lines[0].includes(';') ? ';' : ',';
    const header = lines[0].split(delim).map((h) => h.trim().toLowerCase());
    for (const n of ['item_code', 'gtin', 'unit_type']) {
      if (!header.includes(n)) throw new Error(t('errMissingCol', n));
    }

    const out = [];
    const errors = [];
    lines.slice(1).forEach((line, i) => {
      const cols = line.split(delim).map((c) => c.trim());
      const r = {};
      header.forEach((h, idx) => (r[h] = cols[idx] || ''));
      try {
        const unitType = r.unit_type.toLowerCase();
        if (!r.item_code) throw new Error(t('errNoCode'));
        if (!['box', 'piece', 'kg'].includes(unitType)) throw new Error(t('errUnit', r.unit_type));
        out.push({
          item_code: r.item_code,
          gtin: normalizeGtin(r.gtin),
          unit_type: unitType,
          description: r.description || '',
        });
      } catch (e) {
        errors.push(t('errRow', i + 2, e.message));
      }
    });
    if (errors.length) throw new Error(errors.join('\n'));
    return out;
  }

  function showMsg(text) {
    const el = $('msg');
    el.hidden = !text;
    el.textContent = text || '';
  }

  $('file').onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    showMsg('');
    try {
      items = parseCsv(await f.text());
      $('info').textContent = t('loaded', items.length);
      $('q').disabled = false;
      $('empty').hidden = true;
      $('q').focus();
      search();
    } catch (err) {
      items = [];
      $('q').disabled = true;
      $('info').textContent = '';
      showMsg(err.message);
    }
  };

  // Afișează codul fără sufixul de unitate (-COLLI / -ST / -KG), unitatea apare deja ca badge
  // Pentru duplicate (ex. 1500-ST-2) se afișează "#2" în loc de sufixul complet.
  function displayCode(it) {
    const m = it.item_code.match(/^(.*?)-(COLLI|ST|KG)(?:-(\d+))?$/);
    if (!m) return it.item_code;
    return m[3] ? `${m[1]} #${m[3]}` : m[1];
  }

  // ---------- Căutare ----------
  function search() {
    const q = $('q').value.trim().toLowerCase();
    const list = $('list');
    list.innerHTML = '';
    if (!items.length) return;

    const found = items
      .filter((it) => !q || it.item_code.toLowerCase().includes(q) || it.description.toLowerCase().includes(q))
      .slice(0, 50);

    if (!found.length) {
      list.innerHTML = `<div class="empty">${t('noResults')}</div>`;
      return;
    }

    found.forEach((it) => {
      const row = document.createElement('div');
      row.className = 'row';

      const code = document.createElement('span');
      code.className = 'code';
      code.textContent = displayCode(it);

      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = it.description;

      const badge = document.createElement('span');
      badge.className = 'badge ' + it.unit_type;
      badge.textContent = it.unit_type;

      row.append(code, desc, badge);
      row.onclick = () => select(it);
      list.appendChild(row);
    });
  }

  // KG-items: cantitatea este greutatea in kg, codificata cu (3103)
  function setQtyMode(it) {
    const kg = it.unit_type === 'kg';
    $('qtyLabel').textContent = kg ? t('qtyKg') : t('qty');
    $('qty').step = kg ? '0.001' : '1';
    $('qty').min = kg ? '0.001' : '1';
    $('qty').max = kg ? '999.999' : '99999999';
  }

  function select(it) {
    current = it;
    setQtyMode(it);
    $('qty').value = '1';
    $('selCode').textContent = displayCode(it);
    $('selGtin').textContent = it.gtin;
    $('selDesc').textContent = it.description || it.item_code;
    const badge = $('selType');
    badge.className = 'badge ' + it.unit_type;
    badge.textContent = it.unit_type;
    $('sel').classList.add('show');
    $('list').innerHTML = '';
    $('q').value = '';
    $('result').innerHTML = '';
    $('print').hidden = true;
    $('qty').focus();
    $('sel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- Generare GS1-128 ----------
  $('gen').onclick = () => {
    if (!current) return;
    const qty = $('qty').value.trim();
    const result = $('result');
    result.innerHTML = '';

    let qtyAi;
    if (current.unit_type === 'kg') {
      const w = qty.replace(',', '.');
      if (!/^\d{1,3}(\.\d{1,3})?$/.test(w) || Number(w) <= 0 || Number(w) > 999.999) {
        result.innerHTML = `<div class="err-box">${t('weightInvalid')}</div>`;
        return;
      }
      qtyAi = `(3103)${String(Math.round(Number(w) * 1000)).padStart(6, '0')}`;
    } else {
      if (!/^\d{1,8}$/.test(qty) || Number(qty) < 1) {
        result.innerHTML = `<div class="err-box">${t('qtyInvalid')}</div>`;
        return;
      }
      qtyAi = `(37)${qty}`;
    }

    const batch = $('batch').value.trim();
    if (batch && !/^[A-Za-z0-9\-\/\.]{1,20}$/.test(batch)) {
      result.innerHTML = `<div class="err-box">${t('batchInvalid')}</div>`;
      return;
    }
    const bbd = $('bbd').value; // YYYY-MM-DD
    const yymmdd = bbd ? bbd.slice(2, 4) + bbd.slice(5, 7) + bbd.slice(8, 10) : '';

    let text = `(02)${current.gtin}${qtyAi}`;
    if (batch) text += `(10)${batch}`;
    if (yymmdd) text += `(15)${yymmdd}`;

    const box = document.createElement('div');
    box.className = 'label-preview printable';

    const enc = document.createElement('div');
    enc.className = 'enc';
    enc.textContent = text;

    const canvas = document.createElement('canvas');
    try {
      bwipjs.toCanvas(canvas, {
        bcid: 'gs1-128',
        text: text,
        scale: 3,
        height: 12,
        includetext: true,
        textxalign: 'center',
      });
      box.append(enc, canvas);
      result.append(box);
      $('print').hidden = false;
    } catch (e) {
      result.innerHTML = `<div class="err-box">${t('renderError', e.message)}</div>`;
    }
  };

  // ---------- SSCC (AI 00) ----------
  function genSscc() {
    let body = String(1 + Math.floor(Math.random() * 9)); // extension digit 1-9
    for (let i = 0; i < 16; i++) body += Math.floor(Math.random() * 10);
    return body + gtinCheckDigit(body); // 17 cifre + cifra de control = 18
  }

  $('ssccGen').onclick = () => {
    const sscc = genSscc();
    $('sscc').value = sscc;
    const out = $('ssccResult');
    out.innerHTML = '';

    const box = document.createElement('div');
    box.className = 'label-preview printable';
    const enc = document.createElement('div');
    enc.className = 'enc';
    enc.textContent = `(00)${sscc}`;
    const canvas = document.createElement('canvas');
    bwipjs.toCanvas(canvas, {
      bcid: 'gs1-128',
      text: `(00)${sscc}`,
      scale: 3,
      height: 12,
      includetext: true,
      textxalign: 'center',
    });
    box.append(enc, canvas);
    out.append(box);
    $('ssccPrint').hidden = false;
  };

  $('qty').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('gen').click(); });
  $('q').oninput = search;

  $('lang').onchange = (e) => {
    lang = e.target.value;
    localStorage.setItem('lang', lang);
    applyLang();
  };

  // Încarcă automat baza de date încorporată
  try {
    items = parseCsv(EMBEDDED_CSV);
    $('q').disabled = false;
    $('empty').hidden = true;
  } catch (err) {
    showMsg(err.message);
  }

  applyLang();
</script>
</body>
</html>
