<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GS1-128 Label Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.5.1/dist/bwip-js-min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --brand-soft: #eff6ff;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 2rem 1rem 3.5rem;
    }
    .brand { display: flex; align-items: center; gap: 1rem; }
    .logo { height: 56px; width: auto; background: #fff; border-radius: 10px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    @media (max-width: 600px) { .logo { height: 44px; } }
    .header-top {
      max-width: 880px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; }
    header p { margin: .35rem 0 0; opacity: .85; font-size: .95rem; }
    .lang {
      display: flex; align-items: center; gap: .5rem; flex-shrink: 0;
      background: rgba(255,255,255,.15); border-radius: 10px; padding: .35rem .6rem;
    }
    .lang span { font-size: .85rem; opacity: .9; }
    .lang select {
      font-size: .95rem; padding: .35rem .5rem; border-radius: 8px; border: 0;
      background: #fff; color: var(--text); cursor: pointer; outline: none;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 1rem; }
    main.wrap { margin-top: -2.5rem; margin-bottom: 3rem; }
    .card {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 1.5rem; margin-bottom: 1.25rem;
    }
    .step {
      display: flex; align-items: center; gap: .6rem;
      font-weight: 600; font-size: 1.05rem; margin: 0 0 .9rem;
    }
    .step .num {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--brand-soft); color: var(--brand);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .9rem; font-weight: 700;
    }
    .hint { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
    code { background: #f1f5f9; padding: .1rem .35rem; border-radius: 6px; font-size: .85rem; }

    .upload {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      border: 2px dashed #cbd5e1; border-radius: 12px; padding: 1rem 1.25rem;
      transition: border-color .15s, background .15s;
    }
    .upload:hover { border-color: var(--brand); background: var(--brand-soft); }
    .upload input[type=file] { font-size: .95rem; }
    .upload input[type=file]::file-selector-button {
      margin-right: .75rem; padding: .5rem 1rem; border: 0; border-radius: 8px;
      background: var(--brand); color: #fff; font-weight: 600; cursor: pointer;
    }
    .upload input[type=file]::file-selector-button:hover { background: var(--brand-dark); }

    .status { margin-top: .9rem; font-size: .92rem; }
    .status.ok { color: #047857; }
    .status.err {
      color: var(--danger); background: var(--danger-soft);
      border-radius: 10px; padding: .75rem 1rem; white-space: pre-wrap;
    }

    .search { position: relative; }
    .search input {
      width: 100%; font-size: 1rem; padding: .75rem 1rem .75rem 2.6rem;
      border: 1px solid var(--line); border-radius: 10px; outline: none;
      background: #fff; transition: border-color .15s, box-shadow .15s;
    }
    .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(37,99,235,.15); }
    .search input:disabled { background: #f8fafc; color: var(--muted); }
    .search::before {
      content: "⌕"; position: absolute; left: .9rem; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 1.2rem;
    }
    .list {
      margin-top: .6rem; border: 1px solid var(--line); border-radius: 10px;
      max-height: 320px; overflow-y: auto;
    }
    .list:empty { display: none; }
    .list .row {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: .7rem 1rem; cursor: pointer; border-bottom: 1px solid var(--line);
    }
    .list .row:last-child { border-bottom: 0; }
    .list .row:hover { background: var(--brand-soft); }
    .list .code { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .list .desc { color: var(--muted); font-size: .92rem; flex: 1; text-align: left; }

    .badge {
      font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      padding: .2rem .55rem; border-radius: 999px; white-space: nowrap;
    }
    .badge.box { background: #fef3c7; color: #92400e; }
    .badge.piece { background: #dcfce7; color: #166534; }
    .badge.kg { background: #e0e7ff; color: #3730a3; }

    #sel { display: none; }
    #sel.show { display: block; }
    .article {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap;
      background: var(--brand-soft); border: 1px solid #bfdbfe; border-radius: 12px; padding: 1rem 1.1rem;
      margin-bottom: 1.1rem;
    }
    .article .title { font-weight: 700; font-size: 1.05rem; }
    .article .meta { color: var(--muted); font-size: .9rem; margin-top: .2rem; }
    .article .gtin { font-family: ui-monospace, Consolas, monospace; color: var(--text); }

    .gen-row { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
    .field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .3rem; font-weight: 600; }
    .field input {
      width: 160px; font-size: 1.1rem; padding: .65rem .8rem; border: 1px solid var(--line);
      border-radius: 10px; outline: none; font-variant-numeric: tabular-nums;
    }
    .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(37,99,235,.15); }

    .btn {
      font-size: 1rem; font-weight: 600; padding: .72rem 1.4rem; border: 0; border-radius: 10px;
      cursor: pointer; transition: background .15s, transform .05s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .btn-ghost:hover { background: #f8fafc; }

    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .opt-grid .field input { width: 100%; }
    .opt-grid .field input[type=date] { font-family: inherit; }
    .optional-tag { font-size: .75rem; font-weight: 600; color: var(--muted); background: #f1f5f9; border-radius: 6px; padding: .1rem .45rem; margin-left: .4rem; }
    .sscc-out { margin-top: 1rem; }
    #result:empty { display: none; }
    #ssccResult:empty { display: none; }
    .label-preview {
      margin-top: 1.25rem; border: 1px solid var(--line); border-radius: 12px;
      padding: 1.25rem; text-align: center; background: #fff;
    }
    .label-preview .enc {
      font-family: ui-monospace, Consolas, monospace; font-size: .95rem; color: var(--muted);
      margin-bottom: .9rem; word-break: break-all;
    }
    .label-preview canvas { max-width: 100%; height: auto; }
    .err-box {
      background: var(--danger-soft); color: var(--danger);
      border-radius: 10px; padding: .75rem 1rem;
    }
    .actions { margin-top: 1rem; display: flex; justify-content: flex-end; }
    #print[hidden] { display: none; }

    .empty { text-align: center; color: var(--muted); padding: 1.5rem 0 .5rem; font-size: .95rem; }
    footer { text-align: center; color: var(--muted); font-size: .8rem; padding-bottom: 2rem; }

    @media print {
      body { background: #fff; }
      body * { visibility: hidden; }
      .printable, .printable * { visibility: visible; }
      .printable { position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
      .label-preview { border: 0; padding: 0; }
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .header-top { flex-direction: column; }
      .field input { width: 100%; }
      .opt-grid { grid-template-columns: 1fr; }
      .gen-row .btn { width: 100%; }
      .list .desc { display: none; }
    }
  </style>
</head>

  let items = [];

  const $ = (id) => document.getElementById(id);

  // ---------- Validare GTIN ----------
  function gtinCheckDigit(body13) {
    let sum = 0;
    for (let i = 0; i < body13.length; i++) {
      const digit = Number(body13[body13.length - 1 - i]);
      sum += digit * (i % 2 === 0 ? 3 : 1);
    }
    return (10 - (sum % 10)) % 10;
  }

  function normalizeGtin(raw) {
    const s = String(raw).trim();
    if (!/^\d+$/.test(s) || ![8, 12, 13, 14].includes(s.length)) {
      throw new Error(t('errGtinFormat', s));
    }
    const gtin14 = s.padStart(14, '0');
    if (gtinCheckDigit(gtin14.slice(0, 13)) !== Number(gtin14[13])) {
      throw new Error(t('errCheck', s));
    }
    return gtin14;
  }

  // ---------- Parsare CSV ----------
  function parseCsv(text) {
    text = text.replace(/^\uFEFF/, '');
    const lines = text.split(/\r?\n/).filter((l) => l.trim() !== '');
    if (lines.length < 2) throw new Error(t('errNoHeader'));
    const delim = lines[0].includes(';') ? ';' : ',';
    const header = lines[0].split(delim).map((h) => h.trim().toLowerCase());
    for (const n of ['item_code', 'gtin', 'unit_type']) {
      if (!header.includes(n)) throw new Error(t('errMissingCol', n));
    }

    const out = [];
    const errors = [];
    lines.slice(1).forEach((line, i) => {
      const cols = line.split(delim).map((c) => c.trim());
      const r = {};
      header.forEach((h, idx) => (r[h] = cols[idx] || ''));
      try {
        const unitType = r.unit_type.toLowerCase();
        if (!r.item_code) throw new Error(t('errNoCode'));
        if (!['box', 'piece', 'kg'].includes(unitType)) throw new Error(t('errUnit', r.unit_type));
        out.push({
          item_code: r.item_code,
          gtin: normalizeGtin(r.gtin),
          unit_type: unitType,
          description: r.description || '',
        });
      } catch (e) {
        errors.push(t('errRow', i + 2, e.message));
      }
    });
    if (errors.length) throw new Error(errors.join('\n'));
    return out;
  }

  function showMsg(text) {
    const el = $('msg');
    el.hidden = !text;
    el.textContent = text || '';
  }

  $('file').onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    showMsg('');
    try {
      items = parseCsv(await f.text());
      $('info').textContent = t('loaded', items.length);
      $('q').disabled = false;
      $('empty').hidden = true;
      $('q').focus();
      search();
    } catch (err) {
      items = [];
      $('q').disabled = true;
      $('info').textContent = '';
      showMsg(err.message);
    }
  };

  // ---------- Căutare ----------
  function search() {
    const q = $('q').value.trim().toLowerCase();
    const list = $('list');
    list.innerHTML = '';
    if (!items.length) return;

    const found = items
      .filter((it) => !q || it.item_code.toLowerCase().includes(q) || it.description.toLowerCase().includes(q))
      .slice(0, 50);

    if (!found.length) {
      list.innerHTML = `<div class="empty">${t('noResults')}</div>`;
      return;
    }

    found.forEach((it) => {
      const row = document.createElement('div');
      row.className = 'row';

      const code = document.createElement('span');
      code.className = 'code';
      code.textContent = it.item_code;

      const desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = it.description;

      const badge = document.createElement('span');
      badge.className = 'badge ' + it.unit_type;
      badge.textContent = it.unit_type;

      row.append(code, desc, badge);
      row.onclick = () => select(it);
      list.appendChild(row);
    });
  }

  // KG-items: cantitatea este greutatea in kg, codificata cu (3103)
  function setQtyMode(it) {
    const kg = it.unit_type === 'kg';
    $('qtyLabel').textContent = kg ? t('qtyKg') : t('qty');
    $('qty').step = kg ? '0.001' : '1';
    $('qty').min = kg ? '0.001' : '1';
    $('qty').max = kg ? '999.999' : '99999999';
  }

  function select(it) {
    current = it;
    setQtyMode(it);
    $('qty').value = '1';
    $('selCode').textContent = it.item_code;
    $('selGtin').textContent = it.gtin;
    $('selDesc').textContent = it.description || it.item_code;
    const badge = $('selType');
    badge.className = 'badge ' + it.unit_type;
    badge.textContent = it.unit_type;
    $('sel').classList.add('show');
    $('list').innerHTML = '';
    $('q').value = '';
    $('result').innerHTML = '';
    $('print').hidden = true;
    $('qty').focus();
    $('sel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- Generare GS1-128 ----------
  $('gen').onclick = () => {
    if (!current) return;
    const qty = $('qty').value.trim();
    const result = $('result');
    result.innerHTML = '';

    let qtyAi;
    if (current.unit_type === 'kg') {
      const w = qty.replace(',', '.');
      if (!/^\d{1,3}(\.\d{1,3})?$/.test(w) || Number(w) <= 0 || Number(w) > 999.999) {
        result.innerHTML = `<div class="err-box">${t('weightInvalid')}</div>`;
        return;
      }
      qtyAi = `(3103)${String(Math.round(Number(w) * 1000)).padStart(6, '0')}`;
    } else {
      if (!/^\d{1,8}$/.test(qty) || Number(qty) < 1) {
        result.innerHTML = `<div class="err-box">${t('qtyInvalid')}</div>`;
        return;
      }
      qtyAi = `(37)${qty}`;
    }

    const batch = $('batch').value.trim();
    if (batch && !/^[A-Za-z0-9\-\/\.]{1,20}$/.test(batch)) {
      result.innerHTML = `<div class="err-box">${t('batchInvalid')}</div>`;
      return;
    }
    const bbd = $('bbd').value; // YYYY-MM-DD
    const yymmdd = bbd ? bbd.slice(2, 4) + bbd.slice(5, 7) + bbd.slice(8, 10) : '';

    let text = `(02)${current.gtin}${qtyAi}`;
    if (batch) text += `(10)${batch}`;
    if (yymmdd) text += `(15)${yymmdd}`;

    const box = document.createElement('div');
    box.className = 'label-preview printable';

    const enc = document.createElement('div');
    enc.className = 'enc';
    enc.textContent = text;

    const canvas = document.createElement('canvas');
    try {
      bwipjs.toCanvas(canvas, {
        bcid: 'gs1-128',
        text: text,
        scale: 3,
        height: 12,
        includetext: true,
        textxalign: 'center',
      });
      box.append(enc, canvas);
      result.append(box);
      $('print').hidden = false;
    } catch (e) {
      result.innerHTML = `<div class="err-box">${t('renderError', e.message)}</div>`;
    }
  };

  // ---------- SSCC (AI 00) ----------
  function genSscc() {
    let body = String(1 + Math.floor(Math.random() * 9)); // extension digit 1-9
    for (let i = 0; i < 16; i++) body += Math.floor(Math.random() * 10);
    return body + gtinCheckDigit(body); // 17 cifre + cifra de control = 18
  }

  $('ssccGen').onclick = () => {
    const sscc = genSscc();
    $('sscc').value = sscc;
    const out = $('ssccResult');
    out.innerHTML = '';

    const box = document.createElement('div');
    box.className = 'label-preview printable';
    const enc = document.createElement('div');
    enc.className = 'enc';
    enc.textContent = `(00)${sscc}`;
    const canvas = document.createElement('canvas');
    bwipjs.toCanvas(canvas, {
      bcid: 'gs1-128',
      text: `(00)${sscc}`,
      scale: 3,
      height: 12,
      includetext: true,
      textxalign: 'center',
    });
    box.append(enc, canvas);
    out.append(box);
    $('ssccPrint').hidden = false;
  };

  $('qty').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('gen').click(); });
  $('q').oninput = search;

  $('lang').onchange = (e) => {
    lang = e.target.value;
    localStorage.setItem('lang', lang);
    applyLang();
  };

  // Încarcă automat baza de date încorporată
  try {
    items = parseCsv(EMBEDDED_CSV);
    $('q').disabled = false;
    $('empty').hidden = true;
  } catch (err) {
    showMsg(err.message);
  }

  applyLang();
</script>
</body>
</html>
